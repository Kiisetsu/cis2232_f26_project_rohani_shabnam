<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Animal Report</title>
    <style>
        html { --main-color: #D9C2F0; }
        body { font-family: sans-serif; margin: 0; }
        header { background: var(--main-color); padding: 1rem 2rem; }
        main { padding: 2rem; }
        label { display: block; margin-top: 1rem; }
    </style>
</head>
<body>
<header><h1>Animals by Species and Age</h1></header>
<main>
    <form method="post" th:action="@{/reports/animals}">
        <label>Species
            <select name="species">
                <option>Cat</option>
                <option>Dog</option>
            </select>
        </label>
        <label>Minimum age (years)
            <input type="number" name="minAge" step="0.1" min="0" value="0" required>
        </label>
        <label>Maximum age (years)
            <input type="number" name="maxAge" step="0.1" min="0" value="20" required>
        </label>
        <button type="submit" style="margin-top:1rem">Run report</button>
    </form>
</main>
</body>
</html>
